<!DOCTYPE html><html lang="rw"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Image Upload Form</title>    <style>        body{            font-family: Arial, sans-serif;            background:#f4f4f4;            display:flex;            justify-content:center;            align-items:center;            height:100vh;        }        .container{            background:white;            padding:30px;            border-radius:10px;            box-shadow:0 0 10px rgba(0,0,0,0.2);            width:350px;        }        h2{            text-align:center;            margin-bottom:20px;        }        input[type="file"]{            width:100%;            padding:10px;            margin-bottom:20px;        }        button{            width:100%;            padding:12px;            border:none;            background:blue;            color:white;            font-size:16px;            border-radius:5px;            cursor:pointer;        }        button:hover{            background:darkblue;        }    </style></head><body>    <div class="container">        <h2>sending image</h2>        <form action="#" method="POST" enctype="multipart/form-data">            <input type="file" name="image" accept="image/*" required>            <button type="submit">Upload Image</button>        </form>    </div></body></html>
